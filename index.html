
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Testing Domain</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* Animated background */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .22;
      animation: float 12s ease-in-out infinite alternate;
    }

    .glow.one {
      background: #635bff;
      top: -200px;
      left: -150px;
    }

    .glow.two {
      background: #a855f7;
      bottom: -250px;
      right: -100px;
      animation-delay: -5s;
    }

    .glow.three {
      background: #2563eb;
      top: 40%;
      left: 45%;
      width: 300px;
      height: 300px;
      animation-delay: -8s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(100px, 80px) scale(1.3);
      }
    }

    /* Grid */

    .grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    /* Main content */

    .container {
      text-align: center;
      padding: 30px;
      animation: appear 1.2s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      background: rgba(255,255,255,.04);
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      backdrop-filter: blur(15px);
      animation: appear 1s .2s both;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #a78bfa;
      border-radius: 50%;
      box-shadow: 0 0 12px #a78bfa;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 5px #a78bfa;
      }
      50% {
        opacity: .4;
        box-shadow: 0 0 18px #a78bfa;
      }
    }

    h1 {
      max-width: 900px;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1.1;
      background: linear-gradient(
        110deg,
        #fff 20%,
        #c4b5fd 50%,
        #818cf8 80%,
        #fff 100%
      );
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    .subtitle {
      margin-top: 24px;
      color: #777783;
      font-size: 15px;
      letter-spacing: .3px;
      animation: appear 1s .5s both;
    }

    /* Footer */

    .footer {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #555560;
      font-size: 12px;
      letter-spacing: 1px;
      animation: appear 1s .8s both;
    }

    /* Floating particles */

    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #a78bfa;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      20% {
        opacity: .6;
      }
      80% {
        opacity: .3;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* Mouse spotlight */

    .spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        500px circle at var(--x, 50%) var(--y, 50%),
        rgba(139, 92, 246, .08),
        transparent 70%
      );
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -1.5px;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.6;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>
  </div>

  <div class="grid"></div>
  <div class="spotlight"></div>

  <main class="container">
    <div class="badge">
      <span class="dot"></span>
      Testing
    </div>

    <h1>This domain is currently being used to test</h1>

    <p class="subtitle">
      Nothing to see here. Just a little experimentation.
    </p>
  </main>

  <div class="footer">
    TESTING DOMAIN
  </div>

  <script>
    document.addEventListener("mousemove", (e) => {
      document.documentElement.style.setProperty("--x", e.clientX + "px");
      document.documentElement.style.setProperty("--y", e.clientY + "px");
    });

    for (let i = 0; i < 35; i++) {
      const particle = document.createElement("div");
      particle.className = "particle";
      particle.style.left = Math.random() * 100 + "vw";
      particle.style.animationDuration = (Math.random() * 12 + 8) + "s";
      particle.style.animationDelay = Math.random() * 10 + "s";
      particle.style.width = particle.style.height =
        (Math.random() * 3 + 1) + "px";

      document.body.appendChild(particle);
    }
  </script>

</body>
</html>
